name: Maschinery — macOS installer release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (must match the app version, e.g. v1.0.2)
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: macos-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-15
    environment: release
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      SIGNING_IDENTITY: '-'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - name: Validate release tag
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
      - name: Run XCTest
        run: scripts/test-native.sh
      - name: Build ad-hoc signed Universal 2 Release app and helper
        run: scripts/build-app.sh
      - name: Verify release signatures and version
        shell: bash
        run: |
          scripts/verify-release-signatures.sh
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' dist/Maschinery.app/Contents/Info.plist)
          test "$RELEASE_TAG" = "v$version"
      - name: Check absence of Apple-team trust
        run: swift scripts/check-adhoc-helper.swift dist/Maschinery.app
      - name: Verify ad-hoc XPC peer authentication
        run: scripts/test-helper-trust.sh
      - name: Package certificate-free full installer
        run: scripts/package-installer.sh
      - name: Inspect installer contents and pinned identities
        run: scripts/verify-installer.sh
      - name: Attach full installer and checksum to draft release
        shell: bash
        run: |
          set -euo pipefail
          installer="dist/Maschinery-$RELEASE_TAG-Full-Install.pkg"
          # Only add this macOS artifact; never delete assets from other platforms.
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
            gh release upload "$RELEASE_TAG" "$installer" "$installer.sha256"
          else
            gh release create "$RELEASE_TAG" "$installer" "$installer.sha256" --verify-tag --draft \
              --title "Maschinery ${RELEASE_TAG#v}" \
              --notes 'Universal macOS installer (Apple Silicon and Intel), macOS 14+. Run the installer and approve administrator access, then open Maschinery from Applications. Ad-hoc signed; no Developer ID or notarization. Gatekeeper may require approval in Privacy & Security. Review this draft before publishing.'
          fi
