name: Maschinery — Build and test
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run XCTest
        run: scripts/test-native.sh
      - name: Verify universal app build
        run: scripts/build-app.sh
        env:
          SIGNING_IDENTITY: '-'
      - name: Package and verify DMG
        run: scripts/package-dmg.sh
